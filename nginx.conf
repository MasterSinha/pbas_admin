server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent Nginx from appending its internal port (8080) when issuing HTTP redirects
    absolute_redirect off;
    port_in_redirect off;

    # Convenience redirect from root / to /panel/
    location = / {
        return 301 /panel/;
    }

    # Redirect /panel without trailing slash to /panel/ cleanly
    location = /panel {
        return 301 /panel/;
    }

    # SPA fallback — rewrites unmatched /panel/* requests to /panel/index.html
    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    # Long-cache for static assets (regex locations are matched before the
    # /panel/ prefix above, but root+uri still resolves correctly since the
    # build output lives at /usr/share/nginx/html/panel/)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
